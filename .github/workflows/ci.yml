name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Lint Info.plist
        run: plutil -lint Resources/Info.plist

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package app (universal)
        run: scripts/package-app.sh --universal --zip

      - name: Inspect bundle
        run: |
          lipo -archs build/BrowserSwitch.app/Contents/MacOS/BrowserSwitch
          codesign -dv build/BrowserSwitch.app
          plutil -p build/BrowserSwitch.app/Contents/Info.plist

      - uses: actions/upload-artifact@v7
        with:
          name: BrowserSwitch-${{ github.sha }}
          path: |
            build/BrowserSwitch.zip
            build/BrowserSwitch.zip.sha256
          retention-days: 14

  linux-core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: swift test

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint scripts
        run: shellcheck scripts/*.sh
